<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Extintor</title>
</head>
<body>
<div th:replace="layout :: nav"></div>
<div class="container">
    <div class="page-header">
        <h2 th:text="${extintor.id} ? 'Editar Extintor' : 'Nuevo Extintor'"></h2>
        <a href="/extintores" class="btn btn-secondary">← Volver</a>
    </div>

    <form th:action="@{/extintores/guardar}" th:object="${extintor}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label>Número de Serie</label>
            <input type="text" th:field="*{numeroSerie}" placeholder="EXT-001"/>
        </div>
        <div class="form-group">
            <label>Ubicación</label>
            <input type="text" th:field="*{ubicacion}" placeholder="Planta baja pasillo A"/>
        </div>
        <div class="form-group">
            <label>Tipo</label>
            <select th:field="*{tipo}">
                <option value="PQS">PQS</option>
                <option value="CO2">CO2</option>
                <option value="Agua">Agua</option>
                <option value="Espuma">Espuma</option>
            </select>
        </div>
        <div class="form-group">
            <label>Capacidad (Kg)</label>
            <input type="number" step="0.1" th:field="*{capacidadKg}"/>
        </div>
        <div class="form-group">
            <label>Fecha de Fabricación</label>
            <input type="date" th:field="*{fabricacion}"/>
        </div>
        <div class="form-group">
            <label>Último Servicio</label>
            <input type="date" th:field="*{ultimoServicio}"/>
        </div>
        <div class="form-group">
            <label>Próximo Servicio</label>
            <input type="date" th:field="*{proximoServicio}"/>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/extintores" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inspecciones</title>
    <th:block th:replace="layout :: head"></th:block>
</head>
<body>
<div th:replace="layout :: nav"></div>
<div class="container">
    <div class="page-header">
        <h2>Inspecciones registradas</h2>
        <a href="/inspecciones/nueva" class="btn btn-primary">+ Nueva Inspección</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>#</th>
            <th>Extintor</th>
            <th>Inspector</th>
            <th>Fecha</th>
            <th>Sello</th>
            <th>Buen Estado</th>
            <th>Presión</th>
            <th>Resultado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inspeccion : ${inspecciones}">
            <td th:text="${inspeccion.id}"></td>
            <td th:text="${inspeccion.extintor.numeroSerie}"></td>
            <td th:text="${inspeccion.inspectorNombre}"></td>
            <td th:text="${inspeccion.fecha}"></td>
            <td th:text="${inspeccion.selloSeguridad ? 'Cerrado' : 'Abierto'}"></td>
            <td th:text="${inspeccion.buenEstado ? 'Si' : 'No'}"></td>
            <td th:text="${inspeccion.presionAdecuada ? 'Si' : 'No'}"></td>
            <td>
                        <span th:class="${'badge-' + inspeccion.resultado.toString().toLowerCase()}"
                              th:text="${inspeccion.resultado}"></span>
            </td>
            <td>
                <a th:href="@{/inspecciones/{id}/detalle(id=${inspeccion.id})}" class="btn btn-secondary">Ver detalle</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Extintores</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }

        nav {
            background: #c0392b;
            padding: 1rem 2rem;
            color: white;
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        nav a { color: white; text-decoration: none; font-size: 1rem; }
        nav a:hover { text-decoration: underline; }
        nav h1 { font-size: 1.2rem; margin-right: auto; }

        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th { background: #c0392b; color: white; padding: 0.8rem 1rem; text-align: left; }
        td { padding: 0.8rem 1rem; border-bottom: 1px solid #eee; }
        tr:hover { background: #fef9f9; }

        .btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .btn-primary { background: #c0392b; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-secondary { background: #7f8c8d; color: white; }

        .badge-aprobado { background: #27ae60; color: white; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }
        .badge-rechazado { background: #e74c3c; color: white; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }
        .badge-pendiente { background: #f39c12; color: white; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .page-header h2 { font-size: 1.5rem; color: #2c3e50; }

        form { background: white; padding: 2rem; border-radius: 8px; max-width: 600px; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; color: #555; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        .form-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
    </style>
</head>
<body>
<nav>
    <h1>🔥 Control de Extintores</h1>
    <a href="/extintores">Extintores</a>
    <a href="/inspecciones">Inspecciones</a>
</nav>
<div class="container">
    <div th:replace="${content}"></div>
</div>
</body>
</html>
